# Сводка на телефон по расписанию, без включённого компьютера.
#
# Работает с 26.08.2026 в приватном репозитории cQink/johnyassist. Секреты
# заведены в Settings → Secrets and variables → Actions: TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID, SCHOOLSOFT_ICAL_URL, GROQ_API_KEY.
#
# ПРО ЧАСОВОЙ ПОЯС. cron у GitHub работает в UTC и не знает про летнее время,
# а Стокгольм зимой UTC+1, летом UTC+2. Поэтому часы запусков покрывают оба
# смещения с запасом, а решает, наступило ли окно, сам digest.py (см.
# should_run): он сверяет местное время человека с настройкой и молча выходит,
# если не попал. Сторож этого —
# tests/test_digest.py::test_летом_и_зимой_срабатывает_ровно_один_из_двух_запусков.

name: Сводка на телефон

on:
  schedule:
    # БУДИЛЬНИК НЕ ОДИН, И ЭТО ГЛАВНОЕ ЗДЕСЬ.
    #
    # 27.08.2026 утренняя сводка не пришла вовсе: GitHub не создал НИ ОДНОГО
    # запуска ни в 05:30, ни в 06:30 UTC. Workflow активен, репозиторий свежий,
    # предыдущие запуски зелёные — событие просто потерялось. Расписание в
    # Actions негарантированное: обещаны «возможные задержки при высокой
    # нагрузке», а после аварии часть событий не создаётся совсем (накануне те
    # же вечерние приехали с опозданием на 2.5 и 3.5 часа).
    #
    # 28.08.2026 замерено точнее: за сутки из десяти назначенных запусков
    # GitHub создал ОДИН, и тот в 03:31 UTC — на пять с половиной часов позже
    # своего вечернего времени. Утренних не было вовсе. То есть одного
    # будильника в час мало: теряется не запуск, а весь ряд.
    #
    # Отсюда два вывода, оба здесь применены.
    #
    # ПЕРВОЕ: НЕ :00 И НЕ :30. Документация GitHub прямо говорит, что события
    # задерживаются при высокой нагрузке и что пик — начало часа; :30 занята
    # ровно так же, по той же привычке всех остальных. Ставим :07 и :37.
    #
    # ВТОРОЕ: ДВАЖДЫ В ЧАС И ШИРЕ ПО ЧАСАМ. Окно в digest.py теперь тянется до
    # 15:30, и попасть в него должен хоть один запуск из двадцати, а не из
    # шести. Часы покрывают и лето (UTC+2), и зиму (UTC+1) — какой именно
    # запуск окажется «тем самым», решает digest.py по местному времени, а
    # лишние отсекает отметка в data/last-sent.json.
    #
    # Цена: около тридцати запусков в сутки. Каждый идёт секунд двадцать, но
    # приватный репозиторий тарифицируется поминутно, с округлением вверх, —
    # значит ~900 минут в месяц из бесплатных 2000. Запас есть, но если сюда
    # добавится обычный CI, эти числа придётся пересчитать.
    - cron: "7,37 5-14 * * *"     # утро: 07:07 … 15:37 по Стокгольму (летом)
    - cron: "7,37 19-23 * * *"    # вечер: 21:07 … 00:37
  # Кнопка «запустить сейчас»: и для проверки, и просто чтобы получить сводку
  # среди дня, не дожидаясь утра.
  workflow_dispatch:
    inputs:
      kind:
        description: "Какую сводку собрать"
        type: choice
        options: [auto, morning, evening]
        default: auto
      force:
        description: "Отправить, даже если сказать нечего"
        type: boolean
        default: false

# Право на запись нужно ровно для одного файла — data/school-snapshot.json.
# Отменённый урок SchoolSoft никак не помечает, он просто пропадает из
# выгрузки, поэтому «первый урок отменили» можно сказать только сравнив
# сегодняшнюю выгрузку со вчерашней. Хранить её больше негде: облачный запуск
# начинается с чистой машины, и любой кеш там пуст.
permissions:
  contents: write

# Запуски внутри окна идут раз в час и оба пишут в data/. Наложиться они почти
# не могут (запуск занимает секунд пятнадцать), но «почти» здесь стоит дёшево
# застраховать: два одновременных прогона отправили бы сводку дважды, потому
# что второй прочитал бы отметку до того, как первый её записал.
# cancel-in-progress: false — прерывать уже начатую отправку нельзя.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Календарю, погоде и телеграму хватает стандартной библиотеки: и
      # notify.py, и weather.py ходят в сеть через urllib именно ради этого —
      # ставить requests на каждый запуск незачем. Нужен разбор YAML и часовые
      # пояса.
      #
      # tzdata здесь не «на всякий случай»: без зоны Europe/Stockholm сводка
      # считалась бы по UTC, то есть на два часа мимо, и не приходила бы
      # НИКОГДА, ничем об этом не сообщая. У ubuntu-latest зоны есть в самой
      # системе, но зависеть от образа раннера в таком вопросе не стоит —
      # пакет весит меньше мегабайта. Теперь пропажу видно: digest.py на этом
      # падает с ошибкой, а не молча меняет поведение.
      - run: pip install pyyaml tzdata

      - name: Собрать и отправить
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Ссылка на школьный фид — тоже секрет: SchoolSoft предупреждает, что
          # содержимое календаря видит любой, у кого она есть.
          SCHOOLSOFT_ICAL_URL: ${{ secrets.SCHOOLSOFT_ICAL_URL }}
          # Нужен только для перевода меню столовой. Нет ключа — меню приедет
          # по-шведски, и это единственное последствие.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # Условия написаны через «!=», а не «== && ... || ...», и это не
        # вкусовщина: у GitHub пустая строка ЛОЖНА, поэтому «x == 'auto' && ''»
        # проваливается в правую ветку и подставляет 'auto' вместо пустоты.
        # При запуске по расписанию весь контекст inputs пуст, и обе подстановки
        # дают пустую строку — то есть ровно «python digest.py».
        run: python digest.py ${{ inputs.kind != 'auto' && inputs.kind || '' }} ${{ inputs.force && '--force' || '' }}

      # Слепок расписания коммитим обратно — это память между запусками.
      # Отдельным шагом с `if: always()`: сводка могла не отправиться (нет
      # связи с телеграмом), но расписание при этом уже скачано и сравнено, и
      # терять новый слепок из-за этого нельзя — иначе следующий запуск
      # объявит отменой всё, что изменилось за два дня.
      - name: Запомнить расписание
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Расписание не менялось — коммитить нечего."
            exit 0
          fi
          git config user.name "Johnny (Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Слепок расписания на $(date -u +%Y-%m-%d)"
          # rebase, а не merge: четыре запуска в сутки могут наложиться, и
          # история из merge-коммитов над одним json никому не нужна.
          git pull --rebase --quiet origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
