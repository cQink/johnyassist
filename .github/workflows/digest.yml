# Сводка на телефон по расписанию, без включённого компьютера.
#
# ЭТОТ ФАЙЛ ПОКА НЕ РАБОТАЕТ: у проекта нет удалённого репозитория, и завести
# приватный на GitHub — отдельный шаг, который человек решил сделать позже.
# Файл лежит здесь заранее, потому что он же и есть документация: в нём
# записаны времена запуска и список секретов, которые придётся завести.
#
# ЧТО СДЕЛАТЬ, КОГДА ДОЙДУТ РУКИ:
#   1. Проверить руками, что config/secrets.yaml и models/face-index/ не
#      попадают в git (`git status --ignored` и `git check-ignore -v`).
#      Второе — биометрия, векторы чужих лиц; отменить публикацию нельзя.
#   2. Завести ПРИВАТНЫЙ репозиторий, запушить.
#   3. Settings → Secrets and variables → Actions: TELEGRAM_BOT_TOKEN и
#      TELEGRAM_CHAT_ID (те же значения, что в secrets.yaml).
#   4. Actions → Сводка на телефон → Run workflow: проверить живьём, не дожидаясь утра.
#
# ПРО ЧАСОВОЙ ПОЯС. cron у GitHub работает в UTC и не знает про летнее время,
# а Стокгольм зимой UTC+1, летом UTC+2. Поэтому каждая сводка стоит ДВАЖДЫ, на
# оба смещения, а лишний запуск отсекает сам digest.py (см. should_run): он
# сверяет местное время человека с настройкой и молча выходит, если не попал в
# окно. Сторож этого — tests/test_digest.py::test_летом_и_зимой_срабатывает_ровно_один_из_двух_запусков.
#
# Запуск по cron в Actions штатно опаздывает на 5–15 минут. Для утренней
# сводки это неважно, и окно в digest.py на такое опоздание рассчитано.

name: Сводка на телефон

on:
  schedule:
    - cron: "30 5 * * *"      # 07:30 в Стокгольме летом
    - cron: "30 6 * * *"      # 07:30 зимой
    - cron: "0 19 * * *"      # 21:00 летом
    - cron: "0 20 * * *"      # 21:00 зимой
  # Кнопка «запустить сейчас»: и для проверки, и просто чтобы получить сводку
  # среди дня, не дожидаясь утра.
  workflow_dispatch:
    inputs:
      kind:
        description: "Какую сводку собрать"
        type: choice
        options: [auto, morning, evening]
        default: auto
      force:
        description: "Отправить, даже если сказать нечего"
        type: boolean
        default: false

# Право на запись нужно ровно для одного файла — data/school-snapshot.json.
# Отменённый урок SchoolSoft никак не помечает, он просто пропадает из
# выгрузки, поэтому «первый урок отменили» можно сказать только сравнив
# сегодняшнюю выгрузку со вчерашней. Хранить её больше негде: облачный запуск
# начинается с чистой машины, и любой кеш там пуст.
permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Календарю, погоде и телеграму хватает стандартной библиотеки: и
      # notify.py, и weather.py ходят в сеть через urllib именно ради этого —
      # ставить requests на каждый запуск незачем. Нужен разбор YAML и часовые
      # пояса.
      #
      # tzdata здесь не «на всякий случай»: без зоны Europe/Stockholm сводка
      # считалась бы по UTC, то есть на два часа мимо, и не приходила бы
      # НИКОГДА, ничем об этом не сообщая. У ubuntu-latest зоны есть в самой
      # системе, но зависеть от образа раннера в таком вопросе не стоит —
      # пакет весит меньше мегабайта. Теперь пропажу видно: digest.py на этом
      # падает с ошибкой, а не молча меняет поведение.
      - run: pip install pyyaml tzdata

      - name: Собрать и отправить
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Условия написаны через «!=», а не «== && ... || ...», и это не
        # вкусовщина: у GitHub пустая строка ЛОЖНА, поэтому «x == 'auto' && ''»
        # проваливается в правую ветку и подставляет 'auto' вместо пустоты.
        # При запуске по расписанию весь контекст inputs пуст, и обе подстановки
        # дают пустую строку — то есть ровно «python digest.py».
        run: python digest.py ${{ inputs.kind != 'auto' && inputs.kind || '' }} ${{ inputs.force && '--force' || '' }}

      # Слепок расписания коммитим обратно — это память между запусками.
      # Отдельным шагом с `if: always()`: сводка могла не отправиться (нет
      # связи с телеграмом), но расписание при этом уже скачано и сравнено, и
      # терять новый слепок из-за этого нельзя — иначе следующий запуск
      # объявит отменой всё, что изменилось за два дня.
      - name: Запомнить расписание
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Расписание не менялось — коммитить нечего."
            exit 0
          fi
          git config user.name "Johnny (Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Слепок расписания на $(date -u +%Y-%m-%d)"
          # rebase, а не merge: четыре запуска в сутки могут наложиться, и
          # история из merge-коммитов над одним json никому не нужна.
          git pull --rebase --quiet origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
