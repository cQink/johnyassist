# Люди для команд «позвони *» и «напиши *».
#
# discord   — ОТОБРАЖАЕМОЕ имя, как оно видно в списке личных сообщений.
#             Именно оно лежит в дереве доступности. В списке переписок
#             (ссылка «Гречка (личное сообщение)») сравнение идёт вхождением,
#             потому что Discord дописывает рядом статус («не прочитано»). А
#             вот поле ввода открытой переписки («Написать @Гречка») сверяется
#             СТРОГО: имя должно стоять сразу после «@», и после него ничего
#             быть не должно — это последняя проверка перед отправкой, и
#             вхождением её делать нельзя (contacts.matches_input).
# username  — юзернейм. Нужен запасным путём: если человека нет в списке
#             недавних переписок, искать его придётся через «Найти или начать
#             беседу», а там ищут по юзернейму.
# aliases   — как человека зовут вслух. Падежи с хвостовой гласной («гоше»,
#             «грущику») отрабатывает morph.stem_phrase, поэтому их
#             перечислять не нужно. А вот «георгий»/«георгию» — нужно:
#             «й» не гласная, и сами по себе эти формы не сойдутся.

гоша:
  discord: "Гречка"
  username: "ne_godjaj"
  aliases: ["гоша", "гречка", "георгий", "георгию", "гандон"]

ярик:
  discord: "Грущенко"
  username: "r1ealy"
  aliases: ["ярик", "грущенко", "грущик"]

# Запасной аккаунт хозяина: за ним никто не сидит. На нём делаются живые
# проверки отправки — писать самому себе Discord не позволяет.
#
# Алиаса «тест» тут больше нет намеренно: слово слишком обыденное, и
# «отправь тест на почту» уходило этому аккаунту сообщением «на почту».
# Алиас человека должен быть именем, а не общеупотребительным словом.
твикс:
  discord: "Твикс 1"
  username: "dddasdasd6081"
  aliases: ["твикс"]
