# Сценарий — одна фраза, за которой стоит несколько обычных команд.
#
# Каждый шаг должен ТОЧНО совпадать с командой из commands.yaml: нечёткое
# сравнение внутри сценария не работает намеренно, иначе опечатка тихо
# увела бы шаг не туда. Тест test_shipped_scenarios_all_resolve проверяет
# это при каждом прогоне.
#
# Максимум 5 шагов. Опасные команды (выключение, перезагрузка, сон) внутри
# сценария запрещены — их можно произнести только отдельной фразой.
#
# ПРЕДУПРЕЖДЕНИЕ: шаг «напиши *» (действие discord_message) тоже класть сюда
# нельзя — сборка сценария целиком провалится (chain.resolve вернёт None),
# и вся фраза уйдёт дальше по обычной лестнице разбора, а не выполнится как
# сценарий. Это сознательный запрет (см. johnny/chain.py, _REJECTED_ACTIONS):
# текст сообщения — свободная речь, союзы «и»/«потом»/«затем» в ней
# неизбежны, и хвост фразы легко совпадает с короткой командой — сценарий
# отрезал бы сообщение на середине и попутно выполнил бы что-то ещё.
# discord_call сюда тоже нельзя — он отвергается отдельно, как необратимая
# команда.
#
# Имя сценария (фраза-ключ) не должно начинаться с "открой "/"фокус " —
# в commands.yaml это ловящий всё шаблон (app_focus), и он стоит в файле
# раньше сценарных правил (те добавляются в конец списка команд в config.py),
# поэтому заберёт такую фразу себе первым, а до сценария дело не дойдёт.
режим стрима:
  - запусти обс
  - открой твич
  - громкость 20
