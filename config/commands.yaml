# Внешние тулзы (johnny/connectors). Без ключей и без согласия в settings.yaml
# отвечают отказом с причиной, а не молчанием — команда есть всегда, иначе
# «Джони меня не понял» и «Джони не настроен» звучали бы одинаково.
#
# «Откуда эта картинка» здесь больше нет намеренно: обратный поиск по индексу
# интернета выполнять нечем (см. johnny/connectors/azure_vision.py). Оставить
# фразу значило бы обещать то, чего не будет — Azure отвечает на другой вопрос,
# «что на картинке изображено», и он ниже.
#
# «Прочитай текст» стоит ПЕРЕД «что на картинке»: обе фразы про картинку, но
# features у них разные, и порядок правил здесь и решает, какая сработает.
#
# Свои снимки (экран/окно/камера) стоят ПЕРЕД всеми звёздочными правилами, и это
# не косметика: «прочитай текст с экрана» иначе совпало бы с «прочитай текст *»,
# и Джони пошёл бы искать файл с именем «с экрана». Источник передаётся
# аргументом (screen/window/camera) — новая фраза стоит одной строки, не кода.
#
# Это НЕ «сделай скриншот» выше: тот кладёт картинку человеку в Pictures
# насовсем, а здесь снимок временный и удаляется сразу после ответа —
# на экране может быть чужая переписка.
"прочитай что на экране":
  action: read_capture
  template: "screen"
"прочитай с экрана":
  action: read_capture
  template: "screen"
"прочитай текст с экрана":
