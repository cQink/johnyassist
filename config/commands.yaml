# ВАЖНО: стоят В САМОМ КОНЦЕ файла намеренно. "открой *"/"фокус *" — это
# ловящий всё шаблон (одна звёздочка без хвоста), а route_exact берёт первое
# совпадение по порядку списка. Конкретные "открой ютуб"/"открой браузер" и
# т.п. выше по файлу успевают сработать первыми и не перекрываются. По той же
# причине имя сценария в scenarios.yaml не должно начинаться с "открой "/
# "фокус " — такой сценарий никогда не дойдёт до своего правила, шаблон
# заберёт фразу себе первым (см. предупреждение в scenarios.yaml).
"фокус *":
  action: app_focus
  template: "{0}"
"открой *":
  action: app_focus
  template: "{0}"
