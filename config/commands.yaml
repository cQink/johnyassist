# --- Память ---
# «Запомни, что на экране» — распознать и положить в ДОЛГУЮ память, отдельной
# командой. Само по себе туда не пишется ничего: факты живут до «забудь» и
# уезжают в промпт каждой модели, а на экране бывает чужая переписка.
# Стоит ПЕРЕД «запомни *», и это не вкусовщина: звёздочка перехватила бы фразу
# первой и запомнила буквально «что на экране» вместо того, что там написано.
"запомни что на экране":
  action: remember_capture
  template: "screen"
"запомни текст с экрана":
  action: remember_capture
  template: "screen"
"запомни что в окне":
  action: remember_capture
  template: "window"
