wake_word: "джонни|джони|джани"                 # варианты через | (Vosk слышит «джони» как «джонни»)
vosk_model_path: "models/vosk-model-ru-0.42"   # полная модель (не small) — заметно точнее распознаёт имя «Джони»
response_mode: voice          # voice | beep | off
tts_voice: "ru-RU-DmitryNeural"  # голос edge-tts; напр. ru-RU-SvetlanaNeural (жен.). Нет сети → запасной pyttsx3
tts_provider: fish            # local — свой GPU-сервис; fish — голос Джарвиса (нужен fish_api_key в secrets.yaml); edge — Дмитрий
fish_model_id: "c47719f52ce34cc193b9bc2f00565e8a"   # голос с fish.audio (https://fish.audio/m/c47719f52ce34cc193b9bc2f00565e8a)
# Локальный TTS-сервис (services/tts-server/README.md). Пустой адрес = выключен,
# и при tts_provider: local тоже — Джони молча говорит через fish/edge.
# tts_local_url: "http://127.0.0.1:8765/synthesize"   # свой ПК, или LAN/VPS
# tts_voice_id: "johnny_v1"                           # id голоса в сервисе
# tts_style: "calm"                                   # calm | confident | friendly
groq_model: "openai/gpt-oss-120b"               # быстрые ответы (нужен groq_api_key в secrets.yaml)

# Сильная модель по API-ключу — «доп мозг» для того, с чем не справился Groq.
# Пусто = выключена, и это значение по умолчанию: она стоит денег.
#   opus — claude-opus-5   (нужен anthropic_api_key, pip install anthropic)
#   gpt  — gpt-5.6-sol     (нужен openai_api_key, своего пакета не требует)
# Слот ОДИН и сменный: опрашивать обе — двойная цена за один ответ, а не
# двойная надёжность. Сюда же встанет локальная модель, когда появится.
strong_brain: "opus"
# Адрес API сильной модели. Пусто = официальный (api.anthropic.com). У ключа
# владельца посредник — agentrouter.org, и на официальном адресе такой ключ
# неизвестен: придёт 401, а не «нет денег». Адрес не секрет и живёт здесь, как
# endpoint у Azure; ключ — в secrets.yaml.
# Проверено вживую 2026-08-08: сюда ходит ТОЛЬКО официальный SDK. Сырой POST
# тем же ключом посредник отбивает («unauthorized client detected») — он
# смотрит и на клиента, не только на ключ. Переписать brain_anthropic на свой
# http_client теперь нельзя: связь оборвётся.
strong_brain_base_url: "https://agentrouter.org"
# strong_brain_model: ""      # переопределить модель слота (пусто = по умолчанию)
# strong_brain_first: false   # true — сильная модель отвечает ПЕРВОЙ и на всё:
                              # это уже не «доп мозг», а основной, с его ценой
                              # ($25 за миллион выходных токенов у Opus 5) и
                              # задержкой вместо 0.2–0.5 с у Groq.
tts_volume: 0.6                # 0.0–1.0: громкость голоса Джони и его звуков (не системная громкость)

# Репозиторий для голосовых git-команд: «что с гитом», «на какой я ветке»,
# «что изменилось», «последние коммиты», «закоммить …», «создай ветку …».
# Пусто = команды отвечают «не задана рабочая папка» и git НЕ запускают.
# Это осознанное значение по умолчанию: без явного пути git выполнялся бы в
# папке, из которой стартовал Джони, и рассказывал бы про ЧУЖОЙ репозиторий —
# незаметно для человека.
#
# Джони НИЧЕГО не индексирует сам (`git add` не вызывается вовсе) и не умеет
# push. Что войдёт в коммит — выбираешь заранее руками; пустой индекс он так и
# назовёт. Причины подробно — в johnny/git_tools.py.
git_workdir: ""                # напр. "D:/ssistent/3/johnyassist"

# Стриминг голоса: Groq отдаёт ответ по токенам, Fish поёт его по фразам, а
# филлер должен закрывать паузу до первой фразы — но сейчас список филлеров
# сознательно пуст, см. streaming_fillers ниже и объяснение почему. Стриминг
# сокращает молчание ПЕРЕД ответом; общее время ответа почти не меняется.
# Работает только на голосе fish. false = прежнее поведение целиком.
streaming: true
streaming_first_chunk: 120     # потолок первой фразы в знаках
# Выключены сознательно (2026-08-22), список пуст — это документированное
# значение «филлеров нет»: Fillers.pick() отдаёт пустую строку, а say_stream
# её отсекает. Код выключения ждать не пришлось, он был написан сразу.
#
# Почему убрали. Филлер кладётся в ТУ ЖЕ очередь фраз, что и ответ, только
# раньше него (say_stream.py, «phrases.put(_FillerText(filler))»). Значит ответ
# ждёт, пока филлер договорит. Пока пауза до первой фразы была длинной, это
# была честная маскировка. Но после двух правок — Groq отвечает за 0.65 с
# (решение о смене модели принято 2026-08-20, в конфиг вошло 2026-08-22),
# Whisper расшифровывает за 0.56 с вместо 11.2 (переезд на видеокарту
# 2026-08-22) — маскировать почти нечего, и «Сейчас» перед ответом стало не
# заполнением паузы, а прибавкой к ней. Человек это и услышал: «звучат
# неестественно и будто только замедляют».
#
# Если пауза когда-нибудь вернётся (медленный мозг, отвалившийся стриминг) —
# просто вписать фразы обратно списком. Каждая обязана быть короче 40 знаков,
# иначе не попадёт в кеш TTS, будет синтезироваться заново каждый раз и сама
# станет той задержкой, которую призвана скрыть. Длинные отбрасываются при
# загрузке. Прежний список: Секунду, Сейчас, Минуту, Так, Сейчас скажу, Дайте
# подумать, Смотрю, Один момент, Сейчас разберусь, Так, секунду, Ага, Сейчас
# гляну, Момент, Понял, думаю.
streaming_fillers: []

whisper_model: medium         # small | medium | large-v3
whisper_device: cuda          # cuda | cpu — замер 2026-08-22 на RTX 3070: фраза
                              # 5.2 с, тот же словарь и beam_size, что у Джони.
                              # cpu/int8 — 11.2 с, cuda/float16 — 0.56 с, ровно
                              # в двадцать раз, расшифровка слово в слово та же.
                              #
                              # Прошлый замер (2026-08-08) утверждал обратное:
                              # «cuda не работает, int8 падает на отсутствующем
                              # cublas64_12.dll». С тех пор в среду встали пакеты
                              # nvidia-*, а _enable_cuda_dlls() в recognizer.py
                              # подкладывает их каталоги в PATH до импорта
                              # faster_whisper — DLL находится, ctranslate2 видит
                              # карту и float16. Комментарий описывал среду, а не
                              # железо, и пережил её на две недели.
                              #
                              # Первый в жизни машины запуск CUDA собирает ядра
                              # под карту (~30 с). Результат кешируется на диске
                              # и переживает перезапуск процесса — проверено на
                              # чистом процессе: загрузка 1.9 с, первая фраза
                              # 0.65 с (совпадение с цифрой ответа Groq выше —
                              # не опечатка, это две разные величины). Отдельный
                              # прогрев на старте не нужен.

# Пока идёт игра, Джони уходит на маленькую модель и возвращает видеопамять.
# Пусто = никогда не переключаться. Замер 2026-08-22 на RTX 3070: medium
# занимает 2138 МБ и расшифровывает за 0.56 с, small — 648 МБ и 0.25 с. То
# есть во время игры Джони даже быстрее, просто менее точен на длинных фразах.
whisper_model_gaming: small
# Запасной признак — для игр мимо Steam (Epic, свой лаунчер, просто exe).
# Уходим, когда свободно меньше low; возвращаемся, когда больше high. Зазор
# между ними обязан быть шире 1490 МБ: столько освобождает сама подмена, и на
# узком зазоре уход немедленно перевёл бы условие возврата (game_watch.decide).
gpu_guard_low_mb: 2500
gpu_guard_high_mb: 4500

# Сводка на телефон (digest.py → телеграм). Утром про сегодня, вечером про
# завтра; координаты — для погоды с open-meteo (бесплатно, без ключа).
#
# Часовой пояс здесь ГЛАВНЫЙ параметр, а не украшение: сводку будет считать
# облако в UTC, и без него «сегодня» разъедется с человеческим на два часа
# летом и на час зимой. Пишется именем зоны, а не смещением, — только имя
# знает про переход на летнее время.
digest:
  latitude: 59.3293           # Стокгольм
  longitude: 18.0686
  timezone: "Europe/Stockholm"
  morning: "07:30"            # утренняя сводка: что сегодня
  evening: "21:00"            # вечерняя: что завтра
  # true = когда событий нет и погода обычная, сообщение не отправляется вовсе.
  # Правило принято сознательно: уведомление, приходящее каждый день без
  # повода, через неделю перестают открывать — и тогда пропустят то самое,
  # ради чего всё делалось. false = присылать погоду каждое утро в любом случае.
  quiet_when_nothing: true

# Внешние тулзы (johnny/connectors, ключи — в secrets.yaml).
# consent — отдельно от ключа: ключ значит «могу», согласие — «разрешено».
# Точечное согласие сильнее общего, поэтому «всё, кроме лиц» включается одной
# строкой — иначе человек выключает целиком и не пользуется ничем.
connectors:
  consent: true               # общее согласие на внешние запросы
  azure-vision:
    # ОБЯЗАТЕЛЬНО: у каждого ресурса Azure свой адрес, общего нет. Без него
    # коннектор откажет, а не пойдёт в чужой. Адрес не секрет — потому здесь,
    # а не в secrets.yaml.
    #
    # Это ИМЕННО cognitiveservices-адрес, и перепутать его легко: у того же
    # ресурса есть ещё .services.ai.azure.com (Foundry-проект) и
    # .openai.azure.com (Azure OpenAI). Ключ у всех трёх общий, службы разные,
    # Image Analysis живёт только здесь.
    endpoint: "https://kamiyevh-resource.cognitiveservices.azure.com"
    daily_quota: 160          # суточная доля от 5000/мес на бесплатном F0
  faceplusplus:
    # Включено владельцем осознанно 2026-08-08. Строка остаётся отдельной от
    # общего consent выше — выключить одни лица, оставив картинки и профили,
    # должно быть можно одним словом.
    #
    # Что это меняет: лицо со снимка уходит на серверы Face++ в США. По
    # интернету он не ищет и сравнивает только те снимки, что ему дали, но
    # биометрия остаётся биометрией. Каждый вызов пишется в журнал доступа
    # models/connector-cache/face-access.log — время, режим, имя файла, хеш и
    # число лиц; ни снимка, ни признаков там нет.
    consent: true
    daily_quota: 50
  social-analyzer:
    top: 50                   # сколько сайтов обходить (900 — это минуты)
  translator:
    # Перевод и без этого блока работает офлайн: pip install argostranslate
    # плюс языковые пакеты. Адрес нужен как запасной путь для пар, которых
    # нет локально. Пустой = в сеть не ходим совсем, и это по умолчанию:
    # свой инстанс (docker run libretranslate/libretranslate) — свой адрес,
    # чужой публичный — продиктованный текст уедет наружу.
    endpoint: ""
